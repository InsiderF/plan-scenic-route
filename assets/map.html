<body>
<div id="map" aria-label="景区路线交互地图"></div>
<header class="top">
 <div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 17c4-7 6-7 10 0 4-10 6-10 10 0M2 21h20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>沿 路 · 看 风 景</div>
 <div class="heading"><h1 id="title"></h1><span id="test-badge" class="test-badge" hidden>测试预览</span></div><div id="subtitle" class="subtitle"></div>
 <div class="stats"><div class="stat"><strong id="distance"></strong><small data-short="步行">预计步行</small></div><div class="stat"><strong id="duration"></strong><small data-short="总时间" title="含步行、游览与休息">含游览与休息</small></div><div class="stat"><strong id="count"></strong><small data-short="景点">沿途游览点</small></div></div>
 <p class="notice" id="notice"></p>
</header>
<nav class="tools" aria-label="地图工具">
 <div class="tool compass" aria-label="北方向"><span>↑</span>N</div>
 <button class="tool" id="fit" title="全览路线" aria-label="全览路线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8l8 8m0-8-8 8"/></svg></button>
 <button class="tool" id="locate" title="我的位置" aria-label="我的位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
 <button class="tool" id="zoom-in" aria-label="放大地图">＋</button><button class="tool" id="zoom-out" aria-label="缩小地图">−</button>
</nav>
<section class="sheet" id="sheet" aria-label="游览行程"><div class="handle"></div><div class="sheet-head"><div><div class="sheet-label">YOUR WALK</div><div class="sheet-title" id="sheet-title"></div></div><button class="toggle" id="toggle" aria-expanded="false" aria-controls="list">看行程 ↑</button></div><div id="list" class="list"></div></section>
<div class="legend"><span class="key"><i class="dash"></i>游览路线</span><span class="key"><i class="dot"></i>当前位置</span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>/*__LEAFLET_JS__*/</script>
<script type="application/json" id="route-data">__ROUTE_DATA__</script>
<script>
(()=>{
 'use strict';
 const r=JSON.parse(document.getElementById('route-data').textContent), $=id=>document.getElementById(id);
 const set=(id,t)=>{$(id).textContent=t};
 set('title',r.title);set('subtitle',r.subtitle+' · '+(r.budget_minutes/60).toFixed(0)+'小时预算');set('notice',r.notice);if(r.test_only){$('notice').classList.add('test');$('test-badge').hidden=false;} $('title').title=r.title;
 function stat(id,value,unit){const s=document.createElement('span');s.className='unit';s.textContent=unit;$(id).append(document.createTextNode(value),s)}
 stat('distance',r.walk_km.toFixed(1),'km');stat('duration',(r.total_minutes/60).toFixed(1),'小时');stat('count',r.stops.length,'站');
 set('sheet-title',r.stops[0].name+' → '+r.stops.at(-1).name);
 const AG=r.audio_guide||null;let audioEl=null,audioBtn=null;
 const fmtSec=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 function resetAudioBtn(btn,txt){btn.classList.remove('playing');btn.querySelector('.label').textContent=txt}
 function stopAudio(){if(audioEl)audioEl.pause();if(audioBtn)resetAudioBtn(audioBtn,'▶ 收听'+(audioBtn.dataset.kind==='overview'?'路线总览':'讲解'));audioBtn=null}
 function buildAudio(entry,kind){
  const row=document.createElement('div');row.className='audio-row'+(kind==='overview'?' overview':'');
  const btn=document.createElement('button');btn.className='audio-btn';btn.dataset.kind=kind;
  const label=document.createElement('span');label.className='label';label.textContent='▶ 收听'+(kind==='overview'?'路线总览':'讲解');
  const dur=document.createElement('span');dur.className='dur';dur.textContent=fmtSec(entry.seconds);
  btn.append(label,dur);
  btn.onclick=()=>{
   if(audioBtn===btn&&!audioEl.paused){audioEl.pause();resetAudioBtn(btn,'▶ 继续');return}
   if(audioBtn&&audioBtn!==btn)stopAudio();
   if(!audioEl||audioEl.dataset.file!==entry.file){if(audioEl)audioEl.pause();audioEl=new Audio(entry.file);audioEl.dataset.file=entry.file;
    audioEl.addEventListener('ended',()=>resetAudioBtn(btn,'▶ 重新收听'));
    audioEl.addEventListener('error',()=>{resetAudioBtn(btn,'▶ 重试');toast('音频加载失败，请稍后重试')});}
   audioBtn=btn;
   audioEl.play().then(()=>{btn.classList.add('playing');btn.querySelector('.label').textContent='⏸ 暂停'}).catch(()=>{resetAudioBtn(btn,'▶ 重试');toast('音频暂时无法播放，请稍后重试')});
  };
  row.append(btn);
  const panel=document.createElement('details');panel.className='audio-script';
  const sum=document.createElement('summary');sum.textContent='讲解文字稿';panel.append(sum);
  (entry.transcript||[]).forEach(l=>{const p=document.createElement('div');p.textContent=(l.speaker==='host'?'主持人：':'讲解员：')+l.text;panel.append(p)});
  if(entry.general_knowledge_used){const note=document.createElement('div');note.className='general-note';note.textContent='※ 本段含通识性介绍，未经逐条来源核实';panel.append(note)}
  if((entry.sources||[]).length){const src=document.createElement('div');src.className='src';src.append(document.createTextNode('资料来源：'));entry.sources.forEach((s,i)=>{const a=document.createElement('a');a.textContent=(i?'、':'')+(s.label||'链接');a.href=s.url;a.target='_blank';a.rel='noopener';src.append(a)});panel.append(src)}
  return {row,panel};
 }
 const map=L.map('map',{zoomControl:false,preferCanvas:true,minZoom:12,maxZoom:19,attributionControl:true});
 map.attributionControl.setPrefix('');map.attributionControl.addAttribution('地图 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · ODbL');L.control.scale({position:'bottomleft',imperial:false,maxWidth:65}).addTo(map);
 map.createPane('land');map.getPane('land').style.zIndex=200;map.createPane('roads');map.getPane('roads').style.zIndex=300;map.createPane('route');map.getPane('route').style.zIndex=410;
 const land=r.features.features.filter(f=>f.properties.kind!=='road');land.sort((a,b)=>(a.properties.kind==='water')-(b.properties.kind==='water'));
 L.geoJSON(land,{pane:'land',interactive:false,style:f=>f.properties.kind==='water'?{color:'#b7d2cb',weight:.7,fillColor:'#c5deda',fillOpacity:1}:{color:'#d5dec9',weight:.5,fillColor:'#dce5d1',fillOpacity:.83}}).addTo(map);
 L.geoJSON(r.features.features.filter(f=>f.properties.kind==='road'),{pane:'roads',interactive:false,style:f=>({color:['primary','secondary','tertiary'].includes(f.properties.highway)?'#d9ccaf':'#fcfaf3',weight:['primary','secondary'].includes(f.properties.highway)?3:1.5,opacity:.93})}).addTo(map);
 const point=p=>[p[1],p[0]], all=[], lines=[], arrows=[], markers=[], labels=[], placeLabels=[];let toastTimer,stepLine;
 function toast(t){set('toast',t);$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),5000)}
 r.legs.forEach((leg,i)=>{let groups=[];leg.edges.forEach(edge=>{const last=groups.at(-1);if(last&&last.mode===edge.mode)last.points.push(...edge.geometry.slice(1));else groups.push({mode:edge.mode,points:edge.geometry.slice()})});groups.forEach(g=>{const ps=g.points.map(point);all.push(...ps);L.polyline(ps,{pane:'route',color:'#fffefa',weight:7,opacity:.95,interactive:false}).addTo(map);const line=L.polyline(ps,{pane:'route',color:g.mode==='walk'?'#cc714b':'#527aa2',weight:3.5,opacity:1,dashArray:g.mode==='walk'?null:'8 7'}).addTo(map);line.on('click',()=>focus(i+1));lines.push({line,index:i,ps});let step=0;for(let j=1;j<ps.length;j++){step+=map.distance(ps[j-1],ps[j]);if(step>280&&g.mode==='walk'){const marker=L.marker(ps[j],{pane:'route',interactive:false,icon:L.divIcon({className:'route-arrow',html:'<span>↑</span>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);arrows.push({marker,a:ps[j-1],b:ps[j]});step=0}}})});
 (r.landmarks||[]).forEach(p=>{const tt=L.tooltip({permanent:true,direction:'center',className:'place-label '+p.kind,interactive:false,opacity:1}).setLatLng(point(p.coordinate)).setContent(document.createTextNode(p.name)).addTo(map);placeLabels.push({tt,p})});
 const bounds=L.latLngBounds(all.length?all:r.stops.map(s=>point(s.coordinate)));map.setMaxBounds(bounds.pad(8));
 function fit(){const mobile=innerWidth<760,landscape=innerHeight<600&&innerWidth>=760;const top=12;map.fitBounds(bounds,{paddingTopLeft:mobile?[32,top]:landscape?[410,65]:[560,80],paddingBottomRight:mobile?[55,150]:[70,90],maxZoom:15,animate:false})}
 fit();$('fit').onclick=()=>{if($('sheet').classList.contains('open'))$('toggle').click();if(stepLine){map.removeLayer(stepLine);stepLine=null}$('toast').classList.remove('show');fit()};$('zoom-in').onclick=()=>map.zoomIn();$('zoom-out').onclick=()=>map.zoomOut();
 let active=-1;
 function focus(i){if(stepLine){map.removeLayer(stepLine);stepLine=null}active=i;markers.forEach((m,j)=>m.getElement()?.querySelector('.pin')?.classList.toggle('active',j===i));document.querySelectorAll('.stop').forEach((b,j)=>b.classList.toggle('active',j===i));const current=r.stops[i];map.setView(point(current.coordinate),Math.max(map.getZoom(),16));toast(current.name+' · 建议停留 '+(current.dwell_minutes||0)+' 分钟');lines.forEach(l=>l.line.setStyle({weight:l.index===i-1||l.index===i?5:3.5}));}
 r.stops.forEach((s,i)=>{const icon=L.divIcon({className:'',html:'<span class="pin '+(i===0?'start':i===r.stops.length-1?'end':'')+'">'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const m=L.marker(point(s.coordinate),{icon,title:s.name,keyboard:true}).addTo(map);m.on('click',()=>focus(i));markers.push(m);const tt=L.tooltip({permanent:true,direction:'top',offset:[0,-18],className:'map-label'}).setContent(document.createTextNode(s.name));m.bindTooltip(tt);labels.push({m,tt});const b=document.createElement('button');b.className='stop';b.setAttribute('aria-label','查看'+s.name);const num=document.createElement('span');num.className='num';num.textContent=i+1;const details=document.createElement('div');const name=document.createElement('div');name.className='stop-name';name.textContent=s.name;const note=document.createElement('div');note.className='stop-note';note.textContent=s.description||'沿路线到达已核实的游览访问点。';const meta=document.createElement('div');meta.className='stop-meta';meta.textContent='停留 '+(s.dwell_minutes||0)+' 分钟'+(i<r.legs.length?' · 下一站 '+(r.legs[i].walk_metres/1000).toFixed(1)+' km / 约 '+Math.ceil(r.legs[i].minutes)+' 分钟':' · 行程终点');details.append(name,note,meta);b.append(num,details);b.onclick=()=>focus(i);$('list').append(b);if(AG&&AG.stops&&AG.stops[s.id]){const a=buildAudio(AG.stops[s.id],'stop');$('list').append(a.row);$('list').append(a.panel)}if(r.legs[i])addDirections(r.legs[i],i)});
 if(AG&&AG.overview){const ov=buildAudio(AG.overview,'overview');$('list').prepend(ov.panel);$('list').prepend(ov.row)}
 function addDirections(leg,index){const panel=document.createElement('details');panel.className='directions';const summary=document.createElement('summary');summary.textContent='怎么走 · '+r.stops[index].name+' → '+r.stops[index+1].name;panel.append(summary);const help=document.createElement('p');help.className='direction-help';help.textContent='点击任一步骤，在地图上查看对应路段。起步方向与转向由路网估算，请结合现场路牌。';panel.append(help);(leg.directions||[]).forEach((d,j)=>{const b=document.createElement('button');b.className='direction-step';const n=document.createElement('span');n.textContent=String(j+1).padStart(2,'0');const text=document.createElement('span');text.textContent=d.instruction;b.append(n,text);b.onclick=()=>{document.querySelectorAll('.direction-step').forEach(el=>el.classList.remove('active'));b.classList.add('active');if(stepLine)map.removeLayer(stepLine);stepLine=L.polyline(d.geometry.map(point),{pane:'route',color:'#365f4d',weight:7,opacity:.95,interactive:false}).addTo(map);const mobile=innerWidth<760;map.fitBounds(stepLine.getBounds(),{paddingTopLeft:mobile?[35,15]:[410,70],paddingBottomRight:mobile?[65,Math.ceil($('sheet').getBoundingClientRect().height)+55]:[80,80],maxZoom:18,animate:false});toast(d.name+' · '+Math.round(d.metres)+'米 · 约'+Math.max(1,Math.ceil(d.minutes))+'分钟');requestAnimationFrame(declutter)};panel.append(b)});panel.ontoggle=()=>requestAnimationFrame(declutter);$('list').append(panel)}
 const info=document.createElement('details');info.className='footer-info';const summary=document.createElement('summary');summary.textContent='估算依据与数据来源';info.append(summary);const facts=document.createElement('div');facts.textContent=r.title+' · '+r.subtitle+' · '+(r.budget_minutes/60).toFixed(0)+'小时预算。'+r.notice+' 步行速度 '+r.walk_speed_kmh+' km/h；预留休息 '+r.rest_minutes+' 分钟。地图快照 '+(r.osm_snapshot||'日期未提供')+'。'+(r.test_only?'测试样例未核实当日开放状态。':'定位仅在当前页面内显示。');info.append(facts);r.stops.forEach(s=>{const div=document.createElement('div');const a=document.createElement('a');a.textContent=s.name+' · 信息来源';a.href=s.source.url;a.target='_blank';a.rel='noopener';div.append(a);info.append(div)});$('list').append(info);
 $('toggle').onclick=()=>{const open=$('sheet').classList.toggle('open');$('toggle').setAttribute('aria-expanded',open);set('toggle',open?'收起 ↓':'看行程 ↑');document.querySelectorAll('#zoom-in,#zoom-out').forEach(b=>b.style.visibility=open&&innerWidth<760?'hidden':'visible');requestAnimationFrame(declutter)};
 function declutter(){const overlap=(a,b,p=4)=>a.left<b.right+p&&a.right>b.left-p&&a.top<b.bottom+p&&a.bottom>b.top-p;const panels=[...document.querySelectorAll('.top,.sheet,.tools,.legend')].filter(e=>getComputedStyle(e).display!=='none').map(e=>e.getBoundingClientRect());const pins=markers.map(m=>m.getElement()?.getBoundingClientRect()).filter(Boolean);const boxes=[];const main=placeLabels.filter(o=>o.p.kind==='water'&&o.p.priority>=100),other=placeLabels.filter(o=>!main.includes(o));const candidates=[...main.map(o=>({...o,min:o.p.min_zoom,isStop:false})),...labels.map(o=>({...o,min:12,isStop:true})),...other.map(o=>({...o,min:o.p.min_zoom,isStop:false}))];candidates.forEach(o=>{const el=o.tt.getElement();if(!el)return;el.style.visibility='hidden';if(map.getZoom()<o.min)return;const offsets=o.isStop?[[0,-18]]:o.p.kind==='water'?[[0,0],[40,0],[65,0],[0,30],[40,40],[-40,0],[0,-30]]:[[0,0],[0,-18],[0,18],[22,0],[-22,0]];for(const offset of offsets){o.tt.options.offset=L.point(offset);if(!o.isStop)o.tt.setLatLng(point(o.p.coordinate));else o.tt.setLatLng(o.m.getLatLng());const box=el.getBoundingClientRect();const blocked=box.top<4||box.bottom>innerHeight-26||box.left<4||box.right>innerWidth-4||panels.some(p=>overlap(box,p))||boxes.some(b=>overlap(box,b,7))||(!o.isStop&&pins.some(p=>overlap(box,p,8)));if(!blocked){el.style.visibility='visible';boxes.push(box);break}}});arrows.forEach(a=>{const u=map.latLngToLayerPoint(a.a),v=map.latLngToLayerPoint(a.b);const e=a.marker.getElement();if(e){const deg=Math.atan2(v.x-u.x,-(v.y-u.y))*180/Math.PI;const glyph=e.querySelector('span');if(glyph){glyph.style.display='block';glyph.style.transform='rotate('+deg+'deg)';}e.style.visibility=map.getZoom()<14?'hidden':'visible'}})}
 map.on('zoomend moveend resize',()=>requestAnimationFrame(declutter));requestAnimationFrame(declutter);window.addEventListener('resize',()=>{map.invalidateSize();declutter()});
 let geoMarker,geoCircle,watchId;
 $('locate').onclick=()=>{if(!window.isSecureContext){toast('定位需要 HTTPS 网页；文件查看仍可使用地图和行程。');return}if(!navigator.geolocation){toast('当前浏览器不支持定位。');return}if(watchId!==undefined){navigator.geolocation.clearWatch(watchId);watchId=undefined;$('locate').setAttribute('aria-label','我的位置');toast('已停止位置更新。');return}toast('正在获取位置，请允许浏览器访问定位。');watchId=navigator.geolocation.watchPosition(p=>{const {latitude,longitude,accuracy}=p.coords;if(!Number.isFinite(accuracy)||accuracy<0){toast('定位精度数据无效，请稍后重试。');return}const ll=[latitude,longitude];if(!bounds.pad(.4).contains(ll)){toast('当前位置在本次地图范围外；地图继续显示游览路线。');return}if(!geoMarker){geoMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="geo"></span>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);geoCircle=L.circle(ll,{radius:accuracy,color:'#527aa2',weight:1,fillOpacity:.1}).addTo(map);map.panTo(ll)}else{geoMarker.setLatLng(ll);geoCircle.setLatLng(ll).setRadius(accuracy)}geoMarker.bindTooltip('定位精度约 '+Math.round(accuracy)+' 米');$('locate').setAttribute('aria-label','停止定位');},err=>{toast(err.code===1?'定位权限未允许；仍可查看地图和行程。':err.code===3?'定位超时，请到开阔处重试。':'暂时无法定位，请检查手机定位设置。');if(watchId!==undefined)navigator.geolocation.clearWatch(watchId);watchId=undefined;},{enableHighAccuracy:true,timeout:15000,maximumAge:10000})};
